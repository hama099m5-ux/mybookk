  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none; /* ڕێگری لە دیاریکردن و کۆپیکردنی دەق */
    }

    body {
      background-color: #0f0f11;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
      overflow-x: hidden;
    }

    .page-container {
      position: relative;
      width: 100%;
      max-width: 650px;
      margin-bottom: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
      border-radius: 8px;
      overflow: hidden;
    }

    img {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none; /* ڕێگری لە دەستگرتن لەسەر وێنەدا بۆ داونلۆدکردن */
    }

    /* واتەرمارکی داینەمیکی کڕیار */
    .watermark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-30deg);
      font-size: 22px;
      font-weight: bold;
      color: rgba(255, 255, 255, 0.18);
      white-space: nowrap;
      pointer-events: none;
      text-shadow: 0 0 4px rgba(0, 0, 0, 0.8);
      z-index: 10;
      width: 100%;
      text-align: center;
    }
  </style>
</head>

  <script>
    // چالاککردنی Telegram WebApp
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // وەرگرتنی زانیاری کڕیارەکە
    const user = tg.initDataUnsafe?.user;
    let watermarkText = "Protected Content";

    if (user) {
      const name = user.first_name || "";
      const username = user.username ? `@${user.username}` : `ID: ${user.id}`;
      watermarkText = `${name} (${username})`;
    }

    // لێدانی ئایدی کڕیارەکە وەک واتەرمارک بەسەر هەموو لاپەڕەکاندا
    document.querySelectorAll('.watermark').forEach(el => {
      el.innerText = watermarkText;
    });
  </script>
