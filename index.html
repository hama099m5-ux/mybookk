<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>کتێبی دیجیتاڵیی دەفیانە</title>
  <!-- Telegram Web App Script -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px 0;
    }

    /* 🏷️ واتەرمارکی سووچی لای چەپ - بێ باکگراوند، سایزی بچووک و ڕوون */
    .top-header-watermark {
      position: fixed;
      top: 8px;
      left: 10px;
      background: transparent;
      color: rgba(255, 255, 255, 0.65);
      font-size: 10px;
      z-index: 1000;
      pointer-events: none;
      direction: ltr;
      font-family: monospace, sans-serif;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    }

    .book-container {
      width: 100%;
      max-width: 650px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .page-wrapper {
      position: relative;
      width: 100%;
      background: #ffffff;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .page-image {
      width: 100%;
      display: block;
      height: auto;
    }

    /* 🏷️ نیشانەی بچووکی سەر گۆشەی ڕاستی لاپەڕەکان */
    .page-top-badge {
      position: absolute;
      top: 6px;
      right: 8px;
      font-size: 9px;
      color: rgba(0, 0, 0, 0.35);
      background: rgba(255, 255, 255, 0.6);
      padding: 1px 6px;
      border-radius: 3px;
      pointer-events: none;
      z-index: 10;
      direction: ltr;
      font-family: monospace;
    }

    /* ⚠️ شاشەی ڕەتکردنەوەی دەستگەیشتن */
    #access-denied {
      display: flex;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #121212;
      color: #ffffff;
      text-align: center;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      padding: 24px;
    }

    #access-denied h2 {
      color: #ff4d4d;
      margin-bottom: 12px;
      font-size: 18px;
    }

    #access-denied p {
      font-size: 13px;
      line-height: 1.6;
      color: #b0b0b0;
    }
  </style>
</head>
<body>

  <!-- واتەرمارکی سووچی چەپ (بێ باکگراوند) -->
  <div id="top-watermark" class="top-header-watermark">
    🔒 Checking...
  </div>

  <!-- شاشەی ڕەتکردنەوەی دەستگەیشتن -->
  <div id="access-denied">
    <h2>⚠️ دەستگەیشتن ڕەتکرایەوە</h2>
    <p>ئەم کتێبە تەنها بۆ ئەندامانی کەناڵی تایبەت بەردەستە.<br>تکایە سەرەتا لە کەناڵەکەدا بەشدار ببە.</p>
  </div>

  <!-- کانتێنەری لاپەڕەکان (ئۆتۆماتیکی لە ١ تا ٥٦ دروست دەبێت) -->
  <div class="book-container" id="book-content" style="display: none;"></div>

  <script>
    const BOT_TOKEN = "8885245071:AAE-9S4_Jhthun0UeAWIhJYT4ACIAZ7SpL4";
    const CHANNEL_ID = "-1004456757770";
    const TOTAL_PAGES = 56; // ژمارەی تەواوی ٥٦ لاپەڕەکە

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe?.user;

    if (user && user.id) {
      const name = [user.first_name, user.last_name].filter(Boolean).join(" ");
      const handle = user.username ? `@${user.username}` : `ID: ${user.id}`;
      const watermarkText = `👤 ${name} (${handle})`;

      // جێگیرکردنی زانیاری لە سووچی چەپی سەرەوە
      document.getElementById('top-watermark').innerText = watermarkText;

      // پشکنینی ئەندامبوون لە کەناڵە تایبەتەکەدا
      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getChatMember?chat_id=${CHANNEL_ID}&user_id=${user.id}`)
        .then(res => res.json())
        .then(data => {
          if (data.ok && ['creator', 'administrator', 'member'].includes(data.result.status)) {
            // کاتێک ئەندامە -> لۆدکردنی تەواوی ٥٦ لاپەڕەکە
            const bookContainer = document.getElementById('book-content');
            bookContainer.innerHTML = '';

            for (let i = 1; i <= TOTAL_PAGES; i++) {
              const wrapper = document.createElement('div');
              wrapper.className = 'page-wrapper';
              wrapper.innerHTML = `
                <div class="page-top-badge">${handle}</div>
                <img src="dafyane bookArtboard ${i}.jpg" alt="پەڕەی ${i}" class="page-image" loading="lazy">
              `;
              bookContainer.appendChild(wrapper);
            }

            document.getElementById('access-denied').style.display = 'none';
            document.getElementById('book-content').style.display = 'flex';
          } else {
            document.getElementById('access-denied').style.display = 'flex';
            document.getElementById('book-content').style.display = 'none';
          }
        })
        .catch(() => {
          document.getElementById('access-denied').style.display = 'flex';
          document.getElementById('book-content').style.display = 'none';
        });

    } else {
      document.getElementById('access-denied').style.display = 'flex';
      document.getElementById('book-content').style.display = 'none';
    }
  </script>
</body>
</html>
