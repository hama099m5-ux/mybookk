<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>کتێبی دیجیتاڵیی دەفیانە</title>
  <!-- لێنس و فەرمانەکانی فەرمیی Telegram Web App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-top: 38px;
    }

    /* 🏷️ واتەرمارکی سەروەی شاشەکە (نازی و نەرم) */
    .top-header-watermark {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(20, 20, 20, 0.92);
      backdrop-filter: blur(8px);
      color: rgba(255, 255, 255, 0.75);
      font-size: 11px;
      padding: 8px 12px;
      text-align: center;
      z-index: 1000;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      direction: ltr;
      font-family: sans-serif;
    }

    .book-container {
      width: 100%;
      max-width: 650px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .page-wrapper {
      position: relative;
      width: 100%;
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .page-image {
      width: 100%;
      display: block;
      height: auto;
    }

    /* 🏷️ مارکی بچووکی سەر گۆشەی لاپەڕەکان */
    .page-top-badge {
      position: absolute;
      top: 8px;
      right: 10px;
      font-size: 10px;
      color: rgba(0, 0, 0, 0.45);
      background: rgba(240, 240, 240, 0.85);
      padding: 2px 8px;
      border-radius: 4px;
      pointer-events: none;
      z-index: 10;
      direction: ltr;
      font-family: monospace;
    }

    /* ⚠️ شاشەی ڕەتکردنەوەی دەستگەیشتن */
    #access-denied {
      display: flex;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #121212;
      color: #ffffff;
      text-align: center;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      padding: 24px;
    }

    #access-denied h2 {
      color: #ff4d4d;
      margin-bottom: 12px;
      font-size: 20px;
    }

    #access-denied p {
      font-size: 14px;
      line-height: 1.6;
      color: #b0b0b0;
    }
  </style>
</head>
<body>

  <!-- واتەرمارکی جێگیر لە سەرەوە -->
  <div id="top-watermark" class="top-header-watermark">
    🔒 لە پێداچوونەوەی دەستگەیشتندا...
  </div>

  <!-- شاشەی ڕەتکردنەوە (ئەگەر لە کەناڵەکەدا نەبێت) -->
  <div id="access-denied">
    <h2>⚠️ دەستگەیشتن ڕەتکرایەوە</h2>
    <p>ئەم کتێبە تەنها بۆ ئەندامانی کەناڵی تایبەت بەردەستە.<br>تکایە سەرەتا لە کەناڵەکەدا بەشدار ببە.</p>
  </div>

  <!-- ناوەڕۆکی پەڕەکانی کتێبەکە (تەنها کاتێک دەردەکەوێت کە بەکارهێنەر لە کەناڵەکەدا بێت) -->
  <div class="book-container" id="book-content" style="display: none;">
    
    <!-- پەڕەی ١ -->
    <div class="page-wrapper">
      <div class="page-top-badge user-badge"></div>
      <img src="dafyane bookArtboard 1.jpg" alt="پەڕەی ١" class="page-image">
    </div>

    <!-- پەڕەی ٢ -->
    <div class="page-wrapper">
      <div class="page-top-badge user-badge"></div>
      <img src="dafyane bookArtboard 2.jpg" alt="پەڕەی ٢" class="page-image">
    </div>

    <!-- بە هەمان شێواز دەتوانیت پەڕەکانی تریش لێرە بنووسیتەوە -->

  </div>

  <script>
    // ⚙️ زانیارییەکان بە تەواوی دانراون
    const BOT_TOKEN = "8885245071:AAE-9S4_Jhthun0UeAWIhJYT4ACIAZ7SpL4";
    const CHANNEL_ID = "-1004456757770";

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe?.user;

    if (user && user.id) {
      const name = [user.first_name, user.last_name].filter(Boolean).join(" ");
      const handle = user.username ? `@${user.username}` : `ID: ${user.id}`;
      const watermarkText = `👤 ${name} (${handle})`;

      document.getElementById('top-watermark').innerText = watermarkText;
      document.querySelectorAll('.user-badge').forEach(badge => {
        badge.innerText = handle;
      });

      // پشکنین بۆ ئەندامبوون لە کەناڵەکەدا
      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getChatMember?chat_id=${CHANNEL_ID}&user_id=${user.id}`)
        .then(res => res.json())
        .then(data => {
          if (data.ok && ['creator', 'administrator', 'member'].includes(data.result.status)) {
            // ئەگەر ئەندام بێت -> کتێبەکە پێشان بدە
            document.getElementById('access-denied').style.display = 'none';
            document.getElementById('book-content').style.display = 'flex';
          } else {
            // ئەگەر ئەندام نەبێت -> بلۆکی بکە
            document.getElementById('access-denied').style.display = 'flex';
            document.getElementById('book-content').style.display = 'none';
          }
        })
        .catch(() => {
          document.getElementById('access-denied').style.display = 'flex';
          document.getElementById('book-content').style.display = 'none';
        });

    } else {
      document.getElementById('access-denied').style.display = 'flex';
      document.getElementById('book-content').style.display = 'none';
    }
  </script>
</body>
</html>
