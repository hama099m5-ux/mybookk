<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>کتێبی دیجیتاڵیی دەفیانە</title>
  
  <!-- Telegram Web App Script -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <style>
    /* 🎨 فۆنتی تایبەت (unisirwan zak) */
    @font-face {
      font-family: 'unisirwan zak';
      src: local('unisirwan zak'), local('Uni Sirwan Zak');
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none; /* 🚫 ڕێگری لە مێنیوی Long-Press */
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px 0;
    }

    /* 📊 هێڵی بەرەوپێشچوون لە سەرەوەی شاشە */
    #progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 4px;
      background: linear-gradient(90deg, #ff9f43, #ff5252);
      width: 0%;
      z-index: 2000;
      transition: width 0.1s ease-out;
    }

    /* 🏷️ واتەرمارکی سووچی لای چەپ */
    .top-header-watermark {
      position: fixed;
      top: 12px;
      left: 10px;
      background: transparent;
      color: rgba(255, 255, 255, 0.65);
      font-size: 10px;
      z-index: 1000;
      pointer-events: none;
      direction: ltr;
      font-family: monospace, sans-serif;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    }

    /* 🍔 دگمەی مێنیو لە سووچی ڕاست */
    #menu-btn {
      position: fixed;
      top: 10px;
      right: 12px;
      z-index: 1300;
      background: rgba(30, 30, 30, 0.85);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      width: 38px;
      height: 38px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }

    #menu-btn span {
      width: 20px;
      height: 2px;
      background-color: #ffffff;
      border-radius: 2px;
    }

    /* 📖 پێڕستی بابەتەکان (TOC Sidebar) */
    #toc-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(3px);
      z-index: 1400;
      display: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #toc-overlay.active {
      display: block;
      opacity: 1;
    }

    #toc-sidebar {
      position: fixed;
      top: 0;
      right: -60%;
      width: 55%;
      max-width: 320px;
      min-width: 240px;
      height: 100%;
      background: #1a1a1b;
      z-index: 1500;
      box-shadow: -5px 0 25px rgba(0,0,0,0.8);
      transition: right 0.3s ease;
      display: flex;
      flex-direction: column;
      font-family: 'unisirwan zak', 'Segoe UI', Tahoma, sans-serif;
      direction: rtl;
    }

    #toc-sidebar.open {
      right: 0;
    }

    .toc-header {
      padding: 16px;
      background: #242426;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      position: relative;
    }

    .toc-header h3 {
      font-size: 15px;
      color: #ff9f43;
      font-weight: bold;
    }

    .toc-header h6 {
      font-size: 11px;
      color: #aaa;
      font-weight: normal;
      margin-top: 4px;
    }

    .toc-close-btn {
      position: absolute;
      top: 14px;
      left: 14px;
      background: none;
      border: none;
      color: #aaa;
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
    }

    .toc-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px 8px;
    }

    .toc-list {
      list-style: none;
    }

    .toc-item {
      padding: 10px 12px;
      margin-bottom: 4px;
      border-radius: 6px;
      font-size: 13px;
      color: #dddddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toc-item:active {
      background: rgba(255, 255, 255, 0.1);
    }

    /* 📌 تایتڵە سەرەکییەکان یان سێكشنەکان */
    .toc-section-title {
      font-weight: bold;
      color: #ff9f43;
      font-size: 14px;
      padding: 12px 8px 6px 8px;
      margin-top: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .toc-sub-item {
      padding-right: 20px;
    }

    /* ✉️ بەشی پەیوەندیکردن لە خوارەوەی مێنیو */
    .toc-footer {
      padding: 14px 12px;
      background: #242426;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
      font-size: 12px;
      color: #b0b0b0;
    }

    .toc-footer p {
      margin-bottom: 6px;
      font-size: 11px;
      color: #888;
    }

    .toc-footer a {
      color: #ff9f43;
      text-decoration: none;
      font-weight: bold;
      font-size: 13px;
      direction: ltr;
      display: inline-block;
      padding: 4px 10px;
      background: rgba(255, 159, 67, 0.1);
      border: 1px solid rgba(255, 159, 67, 0.3);
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .toc-footer a:active {
      background: rgba(255, 159, 67, 0.25);
    }

    /* 📚 کانتێنەری لاپەڕەکان */
    .book-container {
      width: 100%;
      max-width: 650px;
      padding: 8px;
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .page-wrapper {
      position: relative;
      width: 100%;
      background: #ffffff;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      touch-action: pan-y;
    }

    .page-image {
      width: 100%;
      display: block;
      height: auto;
      pointer-events: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      transform-origin: center center;
      will-change: transform;
    }

    .page-center-watermark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-20deg);
      font-size: 10px;
      font-weight: normal;
      color: rgba(0, 0, 0, 0.12);
      pointer-events: none;
      z-index: 10;
      direction: ltr;
      font-family: monospace, sans-serif;
      white-space: nowrap;
    }

    .page-bottom-number {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 9px;
      color: rgba(0, 0, 0, 0.45);
      background: rgba(255, 255, 255, 0.75);
      padding: 1px 8px;
      border-radius: 10px;
      pointer-events: none;
      z-index: 10;
      direction: ltr;
      font-family: monospace, sans-serif;
    }

    /* ⚠️ شاشەی ڕەتکردنەوەی دەستگەیشتن */
    #access-denied {
      display: flex;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #121212;
      color: #ffffff;
      text-align: center;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      padding: 24px;
    }

    #access-denied h2 {
      color: #ff4d4d;
      margin-bottom: 12px;
      font-size: 18px;
    }

    #access-denied p {
      font-size: 13px;
      line-height: 1.6;
      color: #b0b0b0;
      margin-bottom: 15px;
    }

    #access-denied h6 {
      font-size: 12px;
      color: #888;
      font-weight: normal;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <!-- 📊 هێڵی بەرەوپێشچوون -->
  <div id="progress-bar"></div>

  <!-- 🏷️ واتەرمارکی سەرەوە -->
  <div id="top-watermark" class="top-header-watermark">
    🔒 Checking...
  </div>

  <!-- 🍔 دگمەی مێنیو -->
  <button id="menu-btn" onclick="openTOC()" aria-label="مێنیو">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <!-- 📖 پێڕستی بابەتەکان -->
  <div id="toc-overlay" onclick="closeTOC()"></div>
  <div id="toc-sidebar">
    <div class="toc-header">
      <h3>📖 پێڕستی دەفیانە</h3>
      <h6>کلیک لەو وانەیە بکە کە دەتەوێت..</h6>
      <button class="toc-close-btn" onclick="closeTOC()">✕</button>
    </div>
    <div class="toc-content">
      <ul class="toc-list" id="toc-list-container">
        <!-- بە داینامیکی دروست دەکرێت -->
      </ul>
    </div>
    <div class="toc-footer">
      <p>بۆ وەڵامدانەوەی پرسیارەکانتان:</p>
      <a href="https://t.me/muhamad5442" target="_blank">بەڕێوەبەر</a>
    </div>
  </div>

  <!-- ⚠️ شاشەی ڕەتکردنەوەی دەستگەیشتن -->
  <div id="access-denied">
    <h2>⚠️ دەستگەیشتن ڕەتکرایەوە</h2>
    <p>ئەم کتێبە تەنها بۆ ئەندامانی کەناڵی دەفیانە بەردەستە.<br>تکایە سەرەتا لە کەناڵەکەدا بەشدار ببە.</p>
    <h6>بۆ بەشداری کردن پەیوەندیمان پێوە بکە:</h6>
    <h6>Instagram: defyane_kurd</h6>
  </div>

  <!-- 📚 کانتێنەری لاپەڕەکان -->
  <div class="book-container" id="book-content" style="display: none;"></div>

  <script>
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.addEventListener('dragstart', event => event.preventDefault());

    // 🌐 لینکی وۆرکەرەکەی Cloudflare
    const WORKER_URL = "https://sparkling-hill-0f7d.hama099m5.workers.dev";

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe?.user;

    // 📊 کۆنتڕۆڵکردنی هێڵی بەرەوپێشچوون
    window.addEventListener('scroll', () => {
      const winScroll = document.documentElement.scrollTop || document.body.scrollTop;
      const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      if (height > 0) {
        const scrolled = (winScroll / height) * 100;
        document.getElementById('progress-bar').style.width = scrolled + '%';
      }
    });

    // 📖 کردنەوە و داخستنی مێنیوی پێڕست
    function openTOC() {
      document.getElementById('toc-sidebar').classList.add('open');
      document.getElementById('toc-overlay').classList.add('active');
    }

    function closeTOC() {
      document.getElementById('toc-sidebar').classList.remove('open');
      document.getElementById('toc-overlay').classList.remove('active');
    }

    function scrollToPage(pageNum) {
      closeTOC();
      const target = document.getElementById(`page-wrapper-${pageNum}`);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    // 🔍 فەنکشنی زوومکردن (Pinch & Double Tap Zoom)
    function enablePageZoom(wrapper) {
      const img = wrapper.querySelector('.page-image');
      let scale = 1, lastScale = 1, startDist = 0, lastTap = 0;
      let posX = 0, posY = 0, startX = 0, startY = 0, isDragging = false;

      wrapper.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          startDist = Math.hypot(
            e.touches[0].pageX - e.touches[1].pageX,
            e.touches[0].pageY - e.touches[1].pageY
          );
          lastScale = scale;
        } else if (e.touches.length === 1) {
          const now = Date.now();
          if (now - lastTap < 300) {
            if (scale > 1) { scale = 1; posX = 0; posY = 0; } 
            else { scale = 2.5; }
            img.style.transition = 'transform 0.25s ease-out';
            applyTransform();
            e.preventDefault();
          } else if (scale > 1) {
            isDragging = true;
            startX = e.touches[0].clientX - posX;
            startY = e.touches[0].clientY - posY;
            img.style.transition = 'none';
          }
          lastTap = now;
        }
      });

      wrapper.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && startDist > 0) {
          e.preventDefault();
          const currentDist = Math.hypot(
            e.touches[0].pageX - e.touches[1].pageX,
            e.touches[0].pageY - e.touches[1].pageY
          );
          scale = Math.min(Math.max(1, lastScale * (currentDist / startDist)), 4);
          if (scale === 1) { posX = 0; posY = 0; }
          img.style.transition = 'none';
          applyTransform();
        } else if (e.touches.length === 1 && isDragging && scale > 1) {
          e.preventDefault();
          posX = e.touches[0].clientX - startX;
          posY = e.touches[0].clientY - startY;
          applyTransform();
        }
      });

      wrapper.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) startDist = 0;
        if (e.touches.length === 0) {
          isDragging = false;
          if (scale < 1.05) {
            scale = 1; posX = 0; posY = 0;
            img.style.transition = 'transform 0.2s ease-out';
            applyTransform();
          }
        }
      });

      function applyTransform() {
        img.style.transform = `translate3d(${posX}px, ${posY}px, 0) scale(${scale})`;
      }
    }

    // 📜 زانیارییەکانی پێڕستی بابەتەکان
    const tocData = [
      { title: "پێشەکی", page: 3 },
      { title: "سەرەتاکانی فێربوونی دەف", page: 6 },
      { title: "فێربوونی نۆتە", page: 10 },
      { title: "تیمپۆ", page: 13 },
      { title: "ڕیتمەکان", isHeader: true },
      { title: "حەی ئەڵڵا", page: 17, isSub: true },
      { title: "مەداحی دووەم", page: 20, isSub: true },
      { title: "زیکری دووەم", page: 22, isSub: true },
      { title: "دائیم", page: 23, isSub: true },
      { title: "سامبا", page: 26, isSub: true },
      { title: "هەڵگرتن", page: 28, isSub: true },
      { title: "حەددادی", page: 31, isSub: true },
      { title: "ماڕش", page: 32, isSub: true },
      { title: "ڤاڵس", page: 36, isSub: true },
      { title: "مەداحی", page: 38, isSub: true },
      { title: "جۆرجینا", page: 40, isSub: true },
      { title: "هێوە", page: 43, isSub: true },
      { title: "گەڕیان", page: 46, isSub: true },
      { title: "بەلەدی + مەقسووم", page: 49, isSub: true },
      { title: "بەشی دووەم تاکژەنی", page: 50, isHeader: true },
      { title: "فێربوونی ڕیز", page: 55, isSub: true }
    ];

    function buildTOC() {
      const container = document.getElementById('toc-list-container');
      container.innerHTML = '';

      tocData.forEach(item => {
        if (item.isHeader && !item.page) {
          const header = document.createElement('li');
          header.className = 'toc-section-title';
          header.innerText = item.title;
          container.appendChild(header);
        } else {
          const li = document.createElement('li');
          let classNames = 'toc-item';
          if (item.isHeader) classNames += ' toc-section-title';
          if (item.isSub) classNames += ' toc-sub-item';
          
          li.className = classNames;
          if (item.page) {
            li.onclick = () => scrollToPage(item.page);
          }
          
          li.innerHTML = `<span>${item.title}</span>`;
          container.appendChild(li);
        }
      });
    }

    if (user && user.id) {
      const name = [user.first_name, user.last_name].filter(Boolean).join(" ");
      const handle = user.username ? `@${user.username}` : `ID: ${user.id}`;
      const watermarkText = `👤 ${name} (${handle})`;

      document.getElementById('top-watermark').innerText = watermarkText;

      // 🔐 داواکاری بۆ Cloudflare Worker لە شوێنی مستەقیمی Telegram API
      fetch(`${WORKER_URL}?user_id=${user.id}`)
        .then(res => res.json())
        .then(data => {
          if (data.isMember) {
            
            const imageList = [];
            for (let i = 1; i <= 16; i++) { imageList.push(`dafyane bookArtboard ${i}.jpg`); }
            imageList.push("dafyane bookArtboard 17.jpg");
            imageList.push("dafyane bookArtboard 17 copy_1.jpg");
            imageList.push("dafyane bookArtboard 17 copy_2.jpg");
            for (let i = 18; i <= 56; i++) { imageList.push(`dafyane bookArtboard ${i}.jpg`); }

            const bookContainer = document.getElementById('book-content');
            bookContainer.innerHTML = '';

            imageList.forEach((fileName, index) => {
              const wrapper = document.createElement('div');
              const pageNum = index + 1;
              wrapper.className = 'page-wrapper';
              wrapper.id = `page-wrapper-${pageNum}`;
              wrapper.innerHTML = `
                <div class="page-center-watermark">${watermarkText}</div>
                <img src="${fileName}" alt="پەڕەی ${pageNum}" class="page-image" loading="lazy">
                <div class="page-bottom-number">${pageNum}</div>
              `;
              bookContainer.appendChild(wrapper);
              enablePageZoom(wrapper);
            });

            buildTOC();

            document.getElementById('access-denied').style.display = 'none';
            document.getElementById('book-content').style.display = 'flex';
          } else {
            document.getElementById('access-denied').style.display = 'flex';
            document.getElementById('book-content').style.display = 'none';
          }
        })
        .catch(() => {
          document.getElementById('access-denied').style.display = 'flex';
          document.getElementById('book-content').style.display = 'none';
        });

    } else {
      document.getElementById('access-denied').style.display = 'flex';
      document.getElementById('book-content').style.display = 'none';
    }
  </script>
</body>
</html>
