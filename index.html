    #access-denied {

      color: #b0b0b0;
      margin-bottom: 15px;
    }
  </style>

<body>

  <script>
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.addEventListener('dragstart', event => event.preventDefault());

    const WORKER_URL = "https://sparkling-hill-0f7d.hama099m5.workers.dev";
    const WORKER_BASE = "https://sparkling-hill-0f7d.hama099m5.workers.dev/play-video/";

    const youtubeLinks = {
      6: ["https://www.youtube.com/watch?v=iRR7GB3jlUs"],
      11: ["https://www.youtube.com/shorts/BXQxtALlju0", "https://www.youtube.com/watch?v=LVOjKCztqTs"],
      13: ["https://www.youtube.com/watch?v=cNhD7utblss"]
    };

    // 🚀 نوێکراوەتەوە: گۆڕینی لینکەکان بۆ Cloudflare Worker Proxy
    const directVideoLinks = {
      15: [WORKER_BASE + "1SARATA.mp4"],
      16: [WORKER_BASE + "2SARATA.mp4"],
      18: [WORKER_BASE + "3HAYALLAH.mp4"],
      21: [WORKER_BASE + "4MADAHISWAM.mp4"],
      22: [WORKER_BASE + "5ZIKIRI.mp4"],
      24: [WORKER_BASE + "5DAIM.mp4"],
      27: [WORKER_BASE + "6SAMBA.mp4"],
      29: [WORKER_BASE + "7HALGRTN.mp4"],
      31: [WORKER_BASE + "8HADDADI.mp4"],
      33: [WORKER_BASE + "9MARCH.mp4"],
      37: [WORKER_BASE + "10VALSE.mp4"],
      38: [WORKER_BASE + "11MADAHI.mp4"],
      41: [WORKER_BASE + "12JORJINA.mp4"],
      44: [WORKER_BASE + "13HEWA.mp4"],
      47: [WORKER_BASE + "14GARYAN.mp4"],
      49: [WORKER_BASE + "15KOT.mp4"],
      51: [WORKER_BASE + "16yell.mp4"],
      54: [WORKER_BASE + "T1.mp4"],
      55: [WORKER_BASE + "T2.mp4"],
      56: [WORKER_BASE + "T3.mp4"]
    };

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe?.user;

    // 📊 هێڵی بەرەوپێشچوون
    window.addEventListener('scroll', () => {
      const winScroll = document.documentElement.scrollTop || document.body.scrollTop;
      const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      if (height > 0) {
        const scrolled = (winScroll / height) * 100;
        document.getElementById('progress-bar').style.width = scrolled + '%';
      }
    });

    // 📖 مێنیوی پێڕست
    function openTOC() {
      document.getElementById('toc-sidebar').classList.add('open');
      document.getElementById('toc-overlay').classList.add('active');
    }

    function closeTOC() {
      document.getElementById('toc-sidebar').classList.remove('open');
      document.getElementById('toc-overlay').classList.remove('active');
    }

    function scrollToPage(pageNum) {
      closeTOC();
      const target = document.getElementById(`page-wrapper-${pageNum}`);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    // 🔁 فەنکشنی چالاککردنی دووبارەبوونەوەی ڤیدیۆ
    function toggleLoop(pageNum) {
      const video = document.getElementById(`inline-player-${pageNum}`);
      const btn = document.getElementById(`loop-btn-${pageNum}`);
      
      if (!video || !btn) return;

      if (video.loop) {
        video.loop = false;
        btn.classList.remove('active');
      } else {
        video.loop = true;
        btn.classList.add('active');
      }
    }

    // 🎬 فەنکشنی لێدان و داخستنی ڤیدیۆ لەناو هەمان لاپەڕە (گونجێنراو بۆ iOS Safari)
    function toggleInlineVideo(pageNum, videoUrl) {
      const box = document.getElementById(`inline-box-${pageNum}`);
      const player = document.getElementById(`inline-player-${pageNum}`);
      const btn = document.getElementById(`vbtn-${pageNum}`);

      // داخستنی هەموو پلەیەرەکانی تر
      document.querySelectorAll('.inline-video-box').forEach(otherBox => {
        if (otherBox.id !== `inline-box-${pageNum}`) {
          otherBox.classList.remove('active');
          const otherPlayer = otherBox.querySelector('video');
          if (otherPlayer) {
            otherPlayer.pause();
            otherPlayer.removeAttribute('src');
            otherPlayer.load();
          }
        }
      });

      document.querySelectorAll('.video-play-btn').forEach(otherBtn => {
        if (otherBtn.id !== `vbtn-${pageNum}`) {
          otherBtn.classList.remove('active-btn');
          const txt = otherBtn.querySelector('span');
          if (txt) txt.innerText = 'شێوازی ژەنین';
        }
      });

      if (!box) return;

      if (box.classList.contains('active')) {
        if (player) {
          player.pause();
          player.removeAttribute('src');
          player.load();
        }
        box.classList.remove('active');
        if (btn) {
          btn.classList.remove('active-btn');
          const txt = btn.querySelector('span');
          if (txt) txt.innerText = 'شێوازی ژەنین';
        }
      } else {
        if (player && videoUrl) {
          if (player.src !== videoUrl) {
            player.src = videoUrl;
            player.load(); // بارکردنەوەی ناچارەکی بۆ پشتیوانی ڕاستەوخۆی iOS
          }
          
          player.loop = false;
          const loopBtn = document.getElementById(`loop-btn-${pageNum}`);
          if (loopBtn) loopBtn.classList.remove('active');

          box.classList.add('active');
          if (btn) {
            btn.classList.add('active-btn');
            const txt = btn.querySelector('span');
            if (txt) txt.innerText = 'داخستنی ڤیدیۆ ✕';
          }
          
          const playPromise = player.play();
          if (playPromise !== undefined) {
            playPromise.catch(e => {
              console.log('Autoplay handled on iOS:', e);
            });
          }
        }
      }
    }

    // 🔍 فەنکشنی زوومکردن
    function enablePageZoom(wrapper) {
      const img = wrapper.querySelector('.page-image');
      if (!img) return;
      let scale = 1, lastScale = 1, startDist = 0, lastTap = 0;
      let posX = 0, posY = 0, startX = 0, startY = 0, isDragging = false;

      wrapper.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          startDist = Math.hypot(
            e.touches[0].pageX - e.touches[1].pageX,
            e.touches[0].pageY - e.touches[1].pageY
          );
          lastScale = scale;
        } else if (e.touches.length === 1) {
          const now = Date.now();
          if (now - lastTap < 300) {
            if (scale > 1) { scale = 1; posX = 0; posY = 0; } 
            else { scale = 2.5; }
            img.style.transition = 'transform 0.25s ease-out';
            applyTransform();
            e.preventDefault();
          } else if (scale > 1) {
            isDragging = true;
            startX = e.touches[0].clientX - posX;
            startY = e.touches[0].clientY - posY;
            img.style.transition = 'none';
          }
          lastTap = now;
        }
      });

      wrapper.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && startDist > 0) {
          e.preventDefault();
          const currentDist = Math.hypot(
            e.touches[0].pageX - e.touches[1].pageX,
            e.touches[0].pageY - e.touches[1].pageY
          );
          scale = Math.min(Math.max(1, lastScale * (currentDist / startDist)), 4);
          if (scale === 1) { posX = 0; posY = 0; }
          img.style.transition = 'none';
          applyTransform();
        } else if (e.touches.length === 1 && isDragging && scale > 1) {
          e.preventDefault();
          posX = e.touches[0].clientX - startX;
          posY = e.touches[0].clientY - startY;
          applyTransform();
        }
      });

      wrapper.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) startDist = 0;
        if (e.touches.length === 0) {
          isDragging = false;
          if (scale < 1.05) {
            scale = 1; posX = 0; posY = 0;
            img.style.transition = 'transform 0.20s ease-out';
            applyTransform();
          }
        }
      });

      function applyTransform() {
        img.style.transform = `translate3d(${posX}px, ${posY}px, 0) scale(${scale})`;
      }
    }

    // 📜 پێڕستی بابەتەکان 
    const tocData = [
      { title: "پێشەکی", page: 3 },
      { title: "سەرەتاکانی فێربوونی دەف", page: 6 },
      { title: "فێربوونی نۆتە", page: 10 },
      { title: "تیمپۆ", page: 13 },
      { title: "ڕیتمەکان", isHeader: true },
      { title: "حەی ئەڵڵا", page: 17, isSub: true },
      { title: "مەداحی دووەم", page: 20, isSub: true },
      { title: "زیکری دووەم", page: 22, isSub: true },
      { title: "دائیم", page: 23, isSub: true },
      { title: "سامبا", page: 26, isSub: true },
      { title: "هەڵگرتن", page: 28, isSub: true },
      { title: "حەددادی", page: 31, isSub: true },
      { title: "ماڕش", page: 32, isSub: true },
      { title: "ڤاڵس", page: 36, isSub: true },
      { title: "مەداحی", page: 38, isSub: true },
      { title: "جۆرجینا", page: 40, isSub: true },
      { title: "هێوە", page: 43, isSub: true },
      { title: "گەڕیان", page: 46, isSub: true },
      { title: "بەلەدی + مەقسووم", page: 49, isSub: true },
      { title: "یەڵدایی", page: 50, isSub: true },
      { title: "بەشی دووەم تاکژەنی", page: 53, isHeader: true },
      { title: "فێربوونی ڕیز", page: 58, isSub: true }
    ];

    function buildTOC() {
      const container = document.getElementById('toc-list-container');
      container.innerHTML = '';

      tocData.forEach(item => {
        if (item.isHeader && !item.page) {
          const header = document.createElement('li');
          header.className = 'toc-section-title';
          header.innerText = item.title;
          container.appendChild(header);
        } else {
          const li = document.createElement('li');
          let classNames = 'toc-item';
          if (item.isHeader) classNames += ' toc-section-title';
          if (item.isSub) classNames += ' toc-sub-item';
          
          li.className = classNames;
          if (item.page) {
            li.onclick = () => scrollToPage(item.page);
          }
          
          li.innerHTML = `<span>${item.title}</span>`;
          container.appendChild(li);
        }
      });
    }

    if (user && user.id) {
      const name = [user.first_name, user.last_name].filter(Boolean).join(" ");
      const handle = user.username ? `@${user.username}` : `ID: ${user.id}`;
      const watermarkText = `👤 ${name} (${handle})`;

      document.getElementById('top-watermark').innerText = watermarkText;

      fetch(`${WORKER_URL}?user_id=${user.id}`)
        .then(res => res.json())
        .then(data => {
          if (data.isMember) {
            
            const imageList = [];
            for (let i = 1; i <= 16; i++) { imageList.push(`dafyane bookArtboard ${i}.jpg`); }
            imageList.push("dafyane bookArtboard 17.jpg");
            imageList.push("dafyane bookArtboard 17 copy_1.jpg");
            imageList.push("dafyane bookArtboard 17 copy_2.jpg");
            for (let i = 18; i <= 47; i++) { imageList.push(`dafyane bookArtboard ${i}.jpg`); }

            imageList.push("dafyane bookArtboard 57.jpg");
            imageList.push("dafyane bookArtboard 58.jpg");
            imageList.push("dafyane bookArtboard 59.jpg");

            for (let i = 48; i <= 56; i++) { imageList.push(`dafyane bookArtboard ${i}.jpg`); }

            const bookContainer = document.getElementById('book-content');
            bookContainer.innerHTML = '';

            imageList.forEach((fileName, index) => {
              const wrapper = document.createElement('div');
              const pageNum = index + 1;
              wrapper.className = 'page-wrapper';
              wrapper.id = `page-wrapper-${pageNum}`;

              let buttonsHtml = '';
              let hasDirectVideo = false;

              if (youtubeLinks[pageNum] && youtubeLinks[pageNum].length > 0) {
                const links = youtubeLinks[pageNum];
                buttonsHtml += links.map((url, idx) => {
                  const label = links.length > 1 ? `ڤیدیۆی ${idx + 1}` : 'ڤیدیۆ';
                  return `
                    <a href="${url}" target="_blank" class="youtube-btn" aria-label="${label}">
                      <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                      <span>${label}</span>
                    </a>
                  `;
                }).join('');
              }

              if (directVideoLinks[pageNum] && directVideoLinks[pageNum].length > 0) {
                hasDirectVideo = true;
                const videoUrl = directVideoLinks[pageNum][0];
                buttonsHtml += `
                  <button id="vbtn-${pageNum}" class="video-play-btn" onclick="toggleInlineVideo(${pageNum}, '${videoUrl}')">
                    <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                    <span>شێوازی ژەنین</span>
                  </button>
                `;
              }

              const mediaBar = buttonsHtml ? `<div class="media-btn-container">${buttonsHtml}</div>` : '';

              const videoBoxHtml = hasDirectVideo ? `
                <div class="inline-video-box" id="inline-box-${pageNum}">
                  <div class="inline-video-bar">
                    <span class="inline-video-title">🎬 شێوازی ژەنین - لاپەڕەی ${pageNum}</span>
                    <button class="inline-video-close-btn" onclick="toggleInlineVideo(${pageNum}, '')">✕ داخستن</button>
                  </div>
                  <video id="inline-player-${pageNum}" class="inline-video-element" controls playsinline webkit-playsinline preload="metadata" controlsList="nodownload"></video>
                  
                  <div class="custom-video-controls">
                    <button id="loop-btn-${pageNum}" class="loop-toggle-btn" onclick="toggleLoop(${pageNum})">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
                      (دووبارەبوونەوە)
                    </button>
                  </div>

                </div>
              ` : '';

              wrapper.innerHTML = `
                <div class="page-image-container">
                  <div class="page-center-watermark">${watermarkText}</div>
                  <img src="${fileName}" alt="پەڕەی ${pageNum}" class="page-image" loading="lazy">
                  <div class="page-bottom-number">${pageNum}</div>
                </div>
                ${mediaBar}
                ${videoBoxHtml}
              `;

              bookContainer.appendChild(wrapper);
              enablePageZoom(wrapper);
            });

            buildTOC();

            document.getElementById('access-denied').style.display = 'none';
            document.getElementById('book-content').style.display = 'flex';
          } else {
            document.getElementById('access-denied').style.display = 'flex';
            document.getElementById('book-content').style.display = 'none';
          }
        })
        .catch(() => {
          document.getElementById('access-denied').style.display = 'flex';
          document.getElementById('book-content').style.display = 'none';
        });

    } else {
      document.getElementById('access-denied').style.display = 'flex';
      document.getElementById('book-content').style.display = 'none';
    }
  </script>
</body>
</html>
