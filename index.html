<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>کتێبی دیجیتاڵیی دەفیانە</title>
  <!-- Telegram Web App Script -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none; /* 🚫 ڕێگری لە مێنیوی Long-Press ی ئایفۆن و ئەندرۆید */
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px 0;
    }

    /* 🏷️ واتەرمارکی سووچی لای چەپ - بێ باکگراوند، سایزی بچووک */
    .top-header-watermark {
      position: fixed;
      top: 8px;
      left: 10px;
      background: transparent;
      color: rgba(255, 255, 255, 0.65);
      font-size: 10px;
      z-index: 1000;
      pointer-events: none;
      direction: ltr;
      font-family: monospace, sans-serif;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    }

    .book-container {
      width: 100%;
      max-width: 650px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .page-wrapper {
      position: relative;
      width: 100%;
      background: #ffffff;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .page-image {
      width: 100%;
      display: block;
      height: auto;
      pointer-events: none; /* 🔒 ⚡ ڕێگری تەواو لە داونلۆد، کۆپی و داگرتنی پەنجە */
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    /* 🏷️ واتەرمارکی ناوەڕاستی لاپەڕەکان - سایزی زۆر بچووک و ئۆپاسیتی نزم */
    .page-center-watermark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-20deg);
      font-size: 10px; /* 👈 سایزەکەی زۆر بچووک کراوەتەوە */
      font-weight: normal;
      color: rgba(0, 0, 0, 0.12); /* ڕەنگێکی زۆر کاڵ کە خوێندنەوە تێک نادات */
      pointer-events: none;
      z-index: 10;
      direction: ltr;
      font-family: monospace, sans-serif;
      white-space: nowrap;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 🔢 ژمارەی لاپەڕە لە خوارەوەی بەشی ناوەڕاست */
    .page-bottom-number {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 9px;
      color: rgba(0, 0, 0, 0.45);
      background: rgba(255, 255, 255, 0.75);
      padding: 1px 8px;
      border-radius: 10px;
      pointer-events: none;
      z-index: 10;
      direction: ltr;
      font-family: monospace, sans-serif;
    }

    /* ⚠️ شاشەی ڕەتکردنەوەی دەستگەیشتن */
    #access-denied {
      display: flex;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #121212;
      color: #ffffff;
      text-align: center;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      padding: 24px;
    }

    #access-denied h2 {
      color: #ff4d4d;
      margin-bottom: 12px;
      font-size: 18px;
    }

    #access-denied p {
      font-size: 13px;
      line-height: 1.6;
      color: #b0b0b0;
      margin-bottom: 15px;
    }

    #access-denied h6 {
      font-size: 12px;
      color: #888;
      font-weight: normal;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <!-- واتەرمارکی سووچی چەپ -->
  <div id="top-watermark" class="top-header-watermark">
    🔒 Checking...
  </div>

  <!-- شاشەی ڕەتکردنەوەی دەستگەیشتن -->
  <div id="access-denied">
    <h2>⚠️ دەستگەیشتن ڕەتکرایەوە</h2>
    <p>ئەم کتێبە تەنها بۆ ئەندامانی کەناڵی دەفیاانە بەردەستە.<br>تکایە سەرەتا لە کەناڵەکەدا بەشدار ببە.</p>
    <h6>بۆ بەشداری کردن پەیوەندیمان پێوە بکە:</h6>
    <h6>0750 186 4672</h6>
  </div>

  <!-- کانتێنەری لاپەڕەکان -->
  <div class="book-container" id="book-content" style="display: none;"></div>

  <script>
    // 🛡️ ڕێگری لە داگرتنی کلیکی ڕاست یان ڕاکێشانی وێنەکان (Drag & Contextmenu)
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.addEventListener('dragstart', event => event.preventDefault());

    const BOT_TOKEN = "8885245071:AAE-9S4_Jhthun0UeAWIhJYT4ACIAZ7SpL4";
    const CHANNEL_ID = "-1004456757770";

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe?.user;

    if (user && user.id) {
      const name = [user.first_name, user.last_name].filter(Boolean).join(" ");
      const handle = user.username ? `@${user.username}` : `ID: ${user.id}`;
      const watermarkText = `👤 ${name} (${handle})`;

      document.getElementById('top-watermark').innerText = watermarkText;

      // پشکنینی ئەندامبوون لە کەناڵدا
      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getChatMember?chat_id=${CHANNEL_ID}&user_id=${user.id}`)
        .then(res => res.json())
        .then(data => {
          if (data.ok && ['creator', 'administrator', 'member'].includes(data.result.status)) {
            
            // 📚 دروستکردنی لیستی ناوی فایلی وێنەکان
            const imageList = [];

            // لاپەڕەکانی ١ تا ١٦
            for (let i = 1; i <= 16; i++) {
              imageList.push(`dafyane bookArtboard ${i}.jpg`);
            }

            // سێ ئاتبۆردەکەی لاپەڕەی ١٧
            imageList.push("dafyane bookArtboard 17 copy_1.jpg");
            imageList.push("dafyane bookArtboard 17 copy_2.jpg");
            imageList.push("dafyane bookArtboard 17.jpg");

            // لاپەڕەکانی ١٨ تا ٥٦
            for (let i = 18; i <= 56; i++) {
              imageList.push(`dafyane bookArtboard ${i}.jpg`);
            }

            // بارکردنی تەواوی وێنەکان
            const bookContainer = document.getElementById('book-content');
            bookContainer.innerHTML = '';

            imageList.forEach((fileName, index) => {
              const wrapper = document.createElement('div');
              wrapper.className = 'page-wrapper';
              wrapper.innerHTML = `
                <div class="page-center-watermark">${watermarkText}</div>
                <img src="${fileName}" alt="پەڕەی ${index + 1}" class="page-image" loading="lazy">
                <div class="page-bottom-number">${index + 1}</div>
              `;
              bookContainer.appendChild(wrapper);
            });

            document.getElementById('access-denied').style.display = 'none';
            document.getElementById('book-content').style.display = 'flex';
          } else {
            document.getElementById('access-denied').style.display = 'flex';
            document.getElementById('book-content').style.display = 'none';
          }
        })
        .catch(() => {
          document.getElementById('access-denied').style.display = 'flex';
          document.getElementById('book-content').style.display = 'none';
        });

    } else {
      document.getElementById('access-denied').style.display = 'flex';
      document.getElementById('book-content').style.display = 'none';
    }
  </script>
</body>
</html>
